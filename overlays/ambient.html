  const FPS = 20
  const FRAME = 1000 / FPS
  const TAU = Math.PI * 2

  const canvas = document.getElementById('screen')
  const ctx = canvas.getContext('2d')
  let W = 0, H = 0, DPR = 1, OX = 0, OY = 0

  // Seeded random (a 32-bit LCG), so the order of ships and paths is the same
  // on every load. The still frame draws from its own generator.
  const lcg = s => () => ((s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296)
  let rnd = lcg(C.seed)
  const pick = (a, r = rnd) => a[(r() * a.length) | 0]
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x))
  const ease = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3)
  const sstep = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k) }

  // ── drawing helpers shared by the scenes ──
  function shapePath(c, shapes, x, y, s, flip) {
    c.beginPath()
    for (const sh of shapes) {
      sh.forEach(([px, py], i) => {
        const X = x + flip * px * s, Y = y + py * s
        if (i) c.lineTo(X, Y); else c.moveTo(X, Y)
      })
      c.closePath()
    }
  }
  // One glyph (a list of polygons in a 0.72 x 1 box), h tall, top-left at (x, y).
  function glyph(g, x, y, h) {
    ctx.beginPath()
    for (const poly of g) poly.forEach(([px, py], i) => i ? ctx.lineTo(x + px * h, y + py * h) : ctx.moveTo(x + px * h, y + py * h))
    ctx.closePath()
    ctx.fill()
  }
  const glyphRow = (row, x, y, h) => { row.forEach((g, i) => glyph(g, x + i * 0.9 * h, y, h)) }
  const glyphCol = (col, x, y, h) => { col.forEach((g, i) => glyph(g, x, y + i * 1.25 * h, h)) }
  const newRow = (n, r = rnd) => Array.from({ length: n }, () => pick(C.glyphs, r))
  // Readouts change with Math.random, so the seeded schedule stays the same.
  const swapGlyph = row => { row[(Math.random() * row.length) | 0] = C.glyphs[(Math.random() * C.glyphs.length) | 0] }

  // Cached sprites: a ship at one width, the emblem at one height.
  const sprites = new Map()
  function shipSprite(key, w, flip) {
    const id = `${key}|${Math.round(w)}|${flip}|${DPR}`
    if (sprites.has(id)) return sprites.get(id)
    const sh = C.ships[key]
    const pad = 8
    const cw = Math.ceil(w + 2 * pad), chh = Math.ceil(w * sh.h + 2 * pad)
    const cv = document.createElement('canvas')
    cv.width = Math.ceil(cw * DPR); cv.height = Math.ceil(chh * DPR)
    const c = cv.getContext('2d')
    c.setTransform(DPR, 0, 0, DPR, 0, 0)
    shapePath(c, sh.shapes, cw / 2, chh / 2, w, flip)
    if (sh.method === 'lines') {
      // Kruge's monitor drew the ship as line art: the traced lines are the shape.
      c.shadowColor = C.ship_glow; c.shadowBlur = 4 * DPR
      c.fillStyle = C.ship
      c.fill('evenodd')
    } else {
      c.fillStyle = C.ship_fill
      c.fill('evenodd')
      c.shadowColor = C.ship_glow; c.shadowBlur = 5 * DPR
      c.strokeStyle = C.ship
      c.lineWidth = 1.6
      c.lineJoin = 'round'
      c.stroke()
    }
    const out = { cv, w: cw, h: chh }
    sprites.set(id, out)
    return out
  }
  function emblemSprite(h) {
    const id = `emblem|${Math.round(h)}|${DPR}`
    if (sprites.has(id)) return sprites.get(id)
    const E = C.emblem
    const [x0, y0, x1, y1] = E.box
    const r = h / (y1 - y0)
    const cw = Math.ceil((x1 - x0) * r + 4), chh = Math.ceil(h + 4)
    const cv = document.createElement('canvas')
    cv.width = Math.ceil(cw * DPR); cv.height = Math.ceil(chh * DPR)
    const c = cv.getContext('2d')
    c.setTransform(DPR, 0, 0, DPR, 0, 0)
    c.translate(2 - x0 * r, 2 - y0 * r)
    const s = r / E.unit
    c.fillStyle = E.gold
    c.beginPath(); c.arc(0, 0, 1.008 * r, 0, TAU); c.fill()
    c.save(); c.scale(s, s)
    c.fill(new Path2D(E.outer))

    const locked = s.lockAge >= 0
    // Two quick flashes as it locks (0.25 s lit, 0.15 s orange), then lit.
    const lit = locked && (s.lockAge > 0.8 || (s.lockAge % 0.4) < 0.25)
    const ax = s.x, ay = s.y - R, lx = s.x - 0.95 * R, rx = s.x + 0.95 * R, by = s.y + 0.6 * R
    const lerp = (a, b, q) => a + (b - a) * q
    ctx.strokeStyle = lit ? C.lock : C.reticle
    ctx.lineWidth = clamp(0.06 * R, 2.5, 5)
    ctx.lineCap = 'butt'
    bar(lerp(ax, lx, 0.16), lerp(ay, by, 0.16), lerp(ax, lx, 0.86), lerp(ay, by, 0.86))
    bar(lerp(ax, rx, 0.16), lerp(ay, by, 0.16), lerp(ax, rx, 0.86), lerp(ay, by, 0.86))
    if (locked) {
      const y = s.y + 0.8 * R
      bar(s.x - 0.5 * R, y, s.x + 0.5 * R, y)
      ctx.lineWidth = 1.5
      bar(s.x - 2.5, y + 3, s.x - 2.5, y + 0.2 * R)
      bar(s.x + 2.5, y + 3, s.x + 2.5, y + 0.2 * R)
    }
    return [lx - 6, ay - 6, rx - lx + 12, 1.05 * R + 0.8 * R + 0.2 * R + 12]
  }
  function drawReadout(s, ct) {
    if (s.lockAge < 0.2) return null
    const a = ctx.globalAlpha
    ctx.globalAlpha = a * sstep((s.lockAge - 0.2) / 0.8)
    const step = Math.floor(s.lockAge / 0.8)
    if (ct.step !== step) {
      ct.step = step
      swapGlyph(ct.col[Math.random() < 0.55 ? 0 : 1])
    }
    const R = tri(s)
    const gh = 10, em = emblemSprite(30)
    const width = Math.max(em.w, 2 * 0.9 * gh + 6)
    const right = ct.side > 0
    const x0 = right ? s.x + 0.95 * R + 16 : s.x - 0.95 * R - 16 - width
    const y0 = s.y - 0.55 * R
    blit(em, x0 + width / 2, y0 + 15)
    ctx.fillStyle = C.glyph
    glyphCol(ct.col[0], x0 + width / 2 - 0.9 * gh - 1, y0 + 34, gh)
    glyphCol(ct.col[1], x0 + width / 2 + 3, y0 + 34, gh)
    ctx.globalAlpha = a
    return [x0 - 6, y0 - 4, width + 12, 34 + 4 * 1.25 * gh + 8]
  }
  // ── end of scene ──

  // ── the schedule: one contact at a time, long gaps ──
  // Times are display seconds (T), which only run while the display runs.
  const FIRST = 6, GAP = [32, 52], CROSS = [52, 68]
  let order = [], last = ''
  function nextShip() {
    if (!order.length) {
      order = C.order.slice()
      for (let i = order.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]] }
      // A new round never starts with the ship that ended the last one.
      if (order.length > 1 && order[order.length - 1] === last) [order[0], order[order.length - 1]] = [order[order.length - 1], order[0]]
    }
    return (last = order.pop())
  }
  function plan(start) {
    const key = nextShip()
    const dir = rnd() < 0.5 ? 1 : -1
    return {
      key, start, dur: CROSS[0] + rnd() * (CROSS[1] - CROSS[0]),
      // Mostly the lower part of the page, where a chat has the most open space.
      // The readout trails the ship, on the side it came from, and stays there.
      dir, side: -dir, yf: 0.42 + 0.36 * rnd(), drift: (rnd() - 0.5) * 0.1,
      top: newRow(7), bot: newRow(5), col: [newRow(4), newRow(3)],
    }
  }
  let T = 0, contact = plan(FIRST)
  const nextAfter = ct => plan(ct.start + ct.dur + GAP[0] + rnd() * (GAP[1] - GAP[0]))

  // Where the contact is at time t, and its reticle state.
  function stateAt(ct, t) {
    const sh = C.ships[ct.key]
    const w = shipWidth(sh)
    const VW = W - OX, VH = H - OY
    const xs = ct.dir > 0 ? OX - 0.6 * w : W + 0.6 * w
    const xe = ct.dir > 0 ? W + 0.6 * w : OX - 0.6 * w
    const u = (t - ct.start) / ct.dur
    const x = xs + (xe - xs) * u
    const y = OY + VH * (ct.yf + ct.drift * u)
    // The lock holds while the ship is well inside the open area.
    const inU = ((ct.dir > 0 ? OX + 0.14 * VW : W - 0.14 * VW) - xs) / (xe - xs)
    const outU = ((ct.dir > 0 ? W - 0.16 * VW : OX + 0.16 * VW) - xs) / (xe - xs)
    const tIn = ct.start + inU * ct.dur, tOut = ct.start + outU * ct.dur
    const ACQ = 2.6
    const k = (t - tIn) / ACQ
    const lockAge = t - (tIn + ACQ)
    const show = t < tIn ? 0 : t < tOut ? sstep((t - tIn) / 0.6) : 1 - sstep((t - tOut) / 1.6)
    const fade = sstep((t - ct.start) / 3) * sstep((ct.start + ct.dur - t) / 3)
    return { sh, w, x, y, u, k, lockAge, show, fade, flip: sh.facing ? sh.facing * ct.dir : 1 }
  }

  let dirty = null
  function paint(t) {
    if (dirty) ctx.clearRect(dirty[0], dirty[1], dirty[2], dirty[3])
    dirty = null
    const ct = contact
    if (t < ct.start || t > ct.start + ct.dur) return
    const s = stateAt(ct, t)
    const box = [s.x - s.w, s.y - s.w, 2 * s.w, 2 * s.w]
    ctx.globalAlpha = s.fade
    blit(shipSprite(ct.key, s.w, s.flip), s.x, s.y)
    if (s.show > 0) {
      ctx.globalAlpha = s.fade * s.show
      const r = drawReticle(s, t)
      const ro = drawReadout(s, ct, t)
      for (const b of [r, ro]) if (b) {
        const x0 = Math.min(box[0], b[0]), y0 = Math.min(box[1], b[1])
        box[2] = Math.max(box[0] + box[2], b[0] + b[2]) - x0; box[3] = Math.max(box[1] + box[3], b[1] + b[3]) - y0
        box[0] = x0; box[1] = y0
      }
    }
    ctx.globalAlpha = 1
    dirty = [Math.floor(box[0] - 12), Math.floor(box[1] - 12), Math.ceil(box[2] + 24), Math.ceil(box[3] + 24)]
  }

  // The still frame for reduced motion: one ship, locked, readout up.
  function still() {
    ctx.clearRect(0, 0, W, H)
    dirty = null
    const key = C.order[0]
    const r = lcg(C.seed + 1)
    const ct = { key, start: 0, dur: 60, dir: 1, side: -1, yf: 0.62, drift: 0, top: newRow(7, r), bot: newRow(5, r), col: [newRow(4, r), newRow(3, r)] }
    const VW = W - OX
    const sh = C.ships[key], w = shipWidth(sh)
    const xs = OX - 0.6 * w, xe = W + 0.6 * w
    const u = (OX + 0.6 * VW - xs) / (xe - xs)
    const s = stateAt(ct, u * ct.dur)
    s.k = 1; s.lockAge = 10; s.show = 1; s.fade = 1
    blit(shipSprite(key, s.w, s.flip), s.x, s.y)
    drawReticle(s, 0)
    drawReadout(s, ct, 0)
  }

  function layout() {
    DPR = Math.min(2, window.devicePixelRatio || 1)
    W = Math.max(1, window.innerWidth)
    H = Math.max(1, window.innerHeight)
    canvas.width = Math.round(W * DPR)
    canvas.height = Math.round(H * DPR)
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
    // The open area right of the session list and below the chat header.
    OX = W >= 1100 ? 470 : W >= 768 ? 250 : 0
    OY = W >= 768 ? 90 : 56
    dirty = null
    sprites.clear()
  }

  // ── host state and the loop ──
  // Kiro Crew posts {type: 'theme:state', mode, reducedMotion} on load and on
  // every change. Nothing draws until the first one arrives. Light mode draws
  // too: this pack's light palette is the films' black one.
  let ready = false, hostReduced = false
  let update = () => {}
  const osReduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return
    const d = e.data
    if (!d || typeof d !== 'object' || d.type !== 'theme:state') return
    ready = true
    hostReduced = d.reducedMotion === true
    update()
  })
  document.addEventListener('visibilitychange', () => update())
  if (osReduced && osReduced.addEventListener) osReduced.addEventListener('change', () => update())

  let RATE = 1, running = false, timer = 0, lastWall = 0, mode = ''
  // `cap` limits one step while animating, so a stalled frame does not jump
  // the ship; a sleep between ships advances by the whole time it slept.
  function advance(now, cap = 0.25) {
    T += Math.min(cap, Math.max(0, now - lastWall) / 1000) * RATE
    lastWall = now
    while (T > contact.start + contact.dur) contact = nextAfter(contact)
  }
  // While a ship is in view, a 20 fps timer wakes and paints; between ships,
  // the screen is cleared once and the timer sleeps until the next one.
  function frame() {
    timer = 0
    if (!running) return
    advance(performance.now())
    paint(T)
    schedule()
  }
  function schedule() {
    if (!running) return
    if (T < contact.start) {
      if (dirty) paint(T)
      const ms = Math.max(50, ((contact.start - T) * 1000) / RATE)
      timer = setTimeout(() => { timer = 0; advance(performance.now(), Infinity); schedule() }, Math.min(ms, 60000))
    } else {
      timer = setTimeout(frame, FRAME)
    }
  }
  function stop() {
    running = false
    if (timer) clearTimeout(timer)
    timer = 0
  }
  update = () => {
    if (!ready) return
    const reduced = hostReduced || !!(osReduced && osReduced.matches)
    const want = reduced ? 'still' : document.hidden ? 'paused' : 'run'
    if (want === mode) return
    mode = want
    stop()
    if (want === 'still') { still(); canvas.classList.add('on'); return }
    if (want === 'paused') return
    running = true
    lastWall = performance.now()
    canvas.classList.add('on')
    ctx.clearRect(0, 0, W, H)
    dirty = null
    schedule()
  }

  window.__klAmbient = {
    // Replay the schedule from the start up to display time s.
    seek: s => {
      rnd = lcg(C.seed); order = []; last = ''; contact = plan(FIRST); T = s
      while (T > contact.start + contact.dur) contact = nextAfter(contact)
      if (mode === 'still') return
      stop(); mode = ''; update()
    },
    rate: r => { RATE = r; if (running) { stop(); mode = ''; update() } },
    info: () => ({ T, mode, contact: { key: contact.key, start: contact.start, dur: contact.dur, dir: contact.dir } }),
  }

  layout()
  window.addEventListener('resize', () => { layout(); if (mode === 'still') still() })
})()
</script>
</body>
</html>
