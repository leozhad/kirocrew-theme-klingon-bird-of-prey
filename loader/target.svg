<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- An orange target of lit triangles with a bracket closing on it (V, frames 542, 543).
       The first frame, which Kiro Crew shows under reduced motion, has the bracket open. -->
  <style>
    .b { transform-origin: 14px 14px; animation: lock 1.6s ease-in-out infinite; }
    @keyframes lock { 0%, 100% { transform: scale(1); } 55% { transform: scale(0.72); } }
    @media (prefers-reduced-motion: reduce) { .b { animation: none; } }
  </style>
  <rect width="28" height="28" rx="5" fill="#000000"/>
  <path d="M10.5 14h7l-3.5 6z M14 8l3.5 6h-7z" fill="#ff5805"/>
  <path class="b" d="M3 9V3h6M19 3h6v6M25 19v6h-6M9 25H3v-6" fill="none" stroke="#ffbc4f" stroke-width="2"/>
</svg>
